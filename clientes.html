<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VESTRA CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg:        #0A0A0A;
  --surf:      #111111;
  --surf2:     #161616;
  --border:    #1e1e1e;
  --text:      #FFFFFF;
  --muted:     #888888;
  --blue:      #0057FF;
  --blue-dim:  #0a1428;
  --blue-ring: #0d2150;
  --green:     #00875A;
  --green-dim: #051a12;
  --green-ring:#0a3020;
  --orange:    #B86800;
  --orange-dim:#1a1000;
  --orange-ring:#2a1a00;
  --red:       #C8392B;
  --red-dim:   #1a0804;
  --red-ring:  #2a1008;
  --purple:    #a78bfa;
  --purple-dim:#120a1f;
  --purple-ring:#2a1a50;
  --yellow:    #ca8a04;
  --yellow-dim:#1a1400;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #F4F5F7;
    --surf:      #FFFFFF;
    --surf2:     #F8F9FB;
    --border:    #E2E5EA;
    --text:      #0A0A0A;
    --muted:     #6B7280;
    --blue-dim:  #EEF3FF;
    --blue-ring: #C7D7FE;
    --green-dim: #ECFDF5;
    --green-ring:#A7F3D0;
    --orange-dim:#FFF7ED;
    --orange-ring:#FED7AA;
    --red-dim:   #FEF2F2;
    --red-ring:  #FECACA;
    --purple-dim:#F5F3FF;
    --purple-ring:#DDD6FE;
    --yellow-dim:#FFFBEB;
  }
}
:root[data-theme="light"] {
  --bg:        #F4F5F7;
  --surf:      #FFFFFF;
  --surf2:     #F8F9FB;
  --border:    #E2E5EA;
  --text:      #0A0A0A;
  --muted:     #6B7280;
  --blue-dim:  #EEF3FF;
  --blue-ring: #C7D7FE;
  --green-dim: #ECFDF5;
  --green-ring:#A7F3D0;
  --orange-dim:#FFF7ED;
  --orange-ring:#FED7AA;
  --red-dim:   #FEF2F2;
  --red-ring:  #FECACA;
  --purple-dim:#F5F3FF;
  --purple-ring:#DDD6FE;
  --yellow-dim:#FFFBEB;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh;}

/* ── SIDEBAR ── */
.sidebar{
  width:220px;background:var(--surf);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;
  position:fixed;top:0;left:0;bottom:0;z-index:100;
}
.sidebar-logo{padding:22px 20px 18px;border-bottom:1px solid var(--border);}
.logo-mark{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--blue);line-height:1;}
.logo-sub{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;margin-top:3px;}
.sidebar-nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;}
.nav-section{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:10px 10px 4px;margin-top:6px;}
.nav-btn{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:5px;
  cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);
  transition:all .15s;border:none;background:none;width:100%;text-align:left;
}
.nav-btn:hover{background:var(--border);color:var(--text);}
.nav-btn.active{background:var(--blue-dim);color:var(--blue);border:1px solid var(--blue-ring);}
.nav-btn .ico{font-size:13px;width:16px;text-align:center;flex-shrink:0;}
.sidebar-foot{padding:14px;border-top:1px solid var(--border);}
.btn-new{
  width:100%;background:var(--blue);color:#fff;border:none;border-radius:5px;
  padding:9px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
  cursor:pointer;transition:opacity .15s;letter-spacing:.01em;
}
.btn-new:hover{opacity:.85;}

/* ── MAIN ── */
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;}
.topbar{
  background:var(--surf);border-bottom:1px solid var(--border);
  padding:14px 26px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.topbar-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.search{
  display:flex;align-items:center;background:var(--bg);
  border:1px solid var(--border);border-radius:5px;padding:0 11px;gap:7px;
}
.search input{
  background:none;border:none;color:var(--text);font-family:'DM Sans',sans-serif;
  font-size:13px;padding:7px 0;width:190px;outline:none;
}
.search input::placeholder{color:var(--muted);}
.content{padding:24px;flex:1;}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;}
.stat{background:var(--surf);border:1px solid var(--border);border-radius:7px;padding:16px 18px;}
.stat-lbl{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
.stat-val{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;}
.stat-val.c-blue{color:var(--blue);}
.stat-val.c-green{color:var(--green);}
.stat-val.c-orange{color:var(--orange);}

/* ── FILTERS ── */
.filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.f-btn{
  display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;
  border:1px solid var(--border);background:none;color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;
}
.f-btn:hover{border-color:var(--blue);color:var(--text);}
.f-btn.active{background:var(--blue-dim);border-color:var(--blue-ring);color:var(--blue);}
.f-cnt{
  background:var(--border);color:var(--muted);border-radius:20px;
  padding:1px 6px;font-family:'DM Mono',monospace;font-size:9px;
}
.f-btn.active .f-cnt{background:var(--blue-ring);color:var(--blue);}

/* ── CLIENT LIST ── */
.c-list{display:flex;flex-direction:column;gap:7px;}
.c-card{
  background:var(--surf);border:1px solid var(--border);border-radius:7px;
  padding:14px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s;
}
.c-card:hover{border-color:var(--blue-ring);background:var(--surf2);}
.c-av{
  width:38px;height:38px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-size:14px;font-weight:800;flex-shrink:0;
  background:var(--blue-dim);color:var(--blue);border:1px solid var(--blue-ring);
}
.c-info{flex:1;min-width:0;}
.c-name{font-weight:600;font-size:14px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-company{font-size:12px;color:var(--muted);}
.c-meta{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.badge{
  font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.4px;
  padding:3px 9px;border-radius:3px;font-weight:500;white-space:nowrap;
}
.b-lead       {background:var(--orange-dim);color:var(--orange);border:1px solid var(--orange-ring);}
.b-prospecto  {background:var(--blue-dim);color:var(--blue);border:1px solid var(--blue-ring);}
.b-propuesta  {background:var(--purple-dim);color:var(--purple);border:1px solid var(--purple-ring);}
.b-negociacion{background:var(--yellow-dim);color:var(--yellow);border:1px solid var(--yellow-dim);}
.b-activo     {background:var(--green-dim);color:var(--green);border:1px solid var(--green-ring);}
.b-perdido    {background:var(--red-dim);color:var(--red);border:1px solid var(--red-ring);}
.c-val{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);min-width:76px;text-align:right;}
.c-date{font-size:10px;color:var(--muted);min-width:82px;text-align:right;}
.date-overdue{color:var(--red)!important;}
.date-today  {color:var(--orange)!important;}
.date-soon   {color:var(--yellow)!important;}

.empty{text-align:center;padding:56px 20px;color:var(--muted);}
.empty-ico{font-size:36px;margin-bottom:14px;}
.empty-ttl{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px;}
.empty-sub{font-size:12px;}

/* ── PIPELINE ── */
.pipe-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;overflow-x:auto;padding-bottom:8px;}
.pipe-col{background:var(--surf);border:1px solid var(--border);border-radius:7px;min-height:380px;display:flex;flex-direction:column;}
.pipe-head{padding:11px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.pipe-title{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:500;}
.pipe-cnt{font-family:'DM Mono',monospace;font-size:9px;background:var(--border);color:var(--muted);padding:2px 6px;border-radius:20px;}
.pipe-body{padding:8px;display:flex;flex-direction:column;gap:7px;flex:1;}
.pipe-card{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:9px 11px;cursor:pointer;transition:all .15s;}
.pipe-card:hover{border-color:var(--blue-ring);}
.pipe-card-name{font-size:11px;font-weight:600;margin-bottom:2px;}
.pipe-card-co{font-size:10px;color:var(--muted);margin-bottom:7px;}
.pipe-card-val{font-family:'DM Mono',monospace;font-size:9px;color:var(--blue);}

/* ── PANEL ── */
.panel-ov{
  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;
  display:none;justify-content:flex-end;
}
.panel-ov.open{display:flex;}
.panel{
  width:460px;background:var(--surf);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;animation:slideIn .18s ease;
}
@keyframes slideIn{from{transform:translateX(36px);opacity:0}to{transform:translateX(0);opacity:1}}
.panel-hd{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.panel-name{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;margin-bottom:3px;}
.panel-co{font-size:12px;color:var(--muted);}
.close-btn{
  background:var(--border);border:none;color:var(--muted);width:30px;height:30px;
  border-radius:5px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;
}
.close-btn:hover{background:var(--red-dim);color:var(--red);}
.panel-body{flex:1;overflow-y:auto;}
.p-section{padding:18px 22px;border-bottom:1px solid var(--border);}
.p-ttl{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.info-item label{display:block;font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
.info-item span{font-size:12px;color:var(--text);font-weight:500;}
.info-item .dim{color:var(--muted);font-weight:400;}
.etapa-sel{display:flex;gap:5px;flex-wrap:wrap;}
.e-opt{
  font-family:'DM Mono',monospace;font-size:9px;padding:4px 9px;border-radius:3px;
  cursor:pointer;border:1px solid var(--border);background:none;color:var(--muted);transition:all .15s;
}
.e-opt:hover{border-color:var(--blue);color:var(--text);}
.e-opt.s-lead       {background:var(--orange-dim);color:var(--orange);border-color:var(--orange-ring);}
.e-opt.s-prospecto  {background:var(--blue-dim);color:var(--blue);border-color:var(--blue-ring);}
.e-opt.s-propuesta  {background:var(--purple-dim);color:var(--purple);border-color:var(--purple-ring);}
.e-opt.s-negociacion{background:var(--yellow-dim);color:var(--yellow);border-color:var(--yellow-dim);}
.e-opt.s-activo     {background:var(--green-dim);color:var(--green);border-color:var(--green-ring);}
.e-opt.s-perdido    {background:var(--red-dim);color:var(--red);border-color:var(--red-ring);}
.inter-list{display:flex;flex-direction:column;gap:9px;}
.inter-item{display:flex;gap:10px;align-items:flex-start;}
.inter-ico{width:28px;height:28px;border-radius:5px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.inter-body{flex:1;}
.inter-hd{display:flex;justify-content:space-between;margin-bottom:2px;}
.inter-tipo{font-size:11px;font-weight:600;}
.inter-fecha{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);}
.inter-txt{font-size:11px;color:var(--muted);line-height:1.5;}
.form-inter{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:12px;margin-top:10px;}
.tipo-row{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;}
.t-btn{
  display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:3px;
  border:1px solid var(--border);background:none;color:var(--muted);font-size:10px;
  cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;
}
.t-btn:hover{border-color:var(--blue);color:var(--text);}
.t-btn.active{background:var(--blue-dim);border-color:var(--blue-ring);color:var(--blue);}
.form-inter textarea{
  width:100%;background:var(--surf);border:1px solid var(--border);border-radius:5px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;
  padding:8px 11px;resize:none;outline:none;line-height:1.5;
}
.form-inter textarea:focus{border-color:var(--blue);}
.form-inter textarea::placeholder{color:var(--muted);}
.inter-foot{display:flex;justify-content:flex-end;margin-top:7px;}
.btn-reg{
  padding:6px 14px;border-radius:5px;font-family:'DM Sans',sans-serif;font-size:11px;
  font-weight:600;cursor:pointer;border:none;background:var(--blue);color:#fff;transition:opacity .15s;
}
.btn-reg:hover{opacity:.85;}
.panel-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:7px;}
.btn-edit{
  flex:1;background:var(--blue);color:#fff;border:none;border-radius:5px;padding:9px;
  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s;
}
.btn-edit:hover{opacity:.85;}
.btn-del{
  background:var(--red-dim);color:var(--red);border:1px solid var(--red-ring);border-radius:5px;
  padding:9px 14px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s;
}
.btn-del:hover{opacity:.75;}

/* ── MODAL ── */
.modal-ov{
  position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:300;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-ov.open{display:flex;}
.modal{
  background:var(--surf);border:1px solid var(--border);border-radius:10px;
  width:100%;max-width:520px;max-height:90vh;overflow-y:auto;animation:fadeUp .18s ease;
}
@keyframes fadeUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-hd{padding:20px 22px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-ttl{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;}
.modal-body{padding:22px;display:flex;flex-direction:column;gap:14px;}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.f-grp{display:flex;flex-direction:column;gap:5px;}
.f-grp.full{grid-column:1/-1;}
.f-grp label{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.f-grp input,.f-grp select,.f-grp textarea{
  background:var(--bg);border:1px solid var(--border);border-radius:5px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;
  padding:9px 11px;outline:none;transition:border-color .15s;width:100%;
}
.f-grp input:focus,.f-grp select:focus,.f-grp textarea:focus{border-color:var(--blue);}
.f-grp input::placeholder,.f-grp textarea::placeholder{color:var(--muted);}
.f-grp select option{background:var(--surf);}
.f-grp textarea{resize:vertical;min-height:72px;line-height:1.5;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.btn-cancel{
  background:none;border:1px solid var(--border);color:var(--muted);border-radius:5px;
  padding:9px 18px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;
}
.btn-cancel:hover{border-color:var(--text);color:var(--text);}
.btn-save{
  background:var(--blue);border:none;color:#fff;border-radius:5px;
  padding:9px 22px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s;
}
.btn-save:hover{opacity:.85;}

/* ── NOTAS ── */
.notas-area{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:14px;
  resize:none;outline:none;min-height:280px;line-height:1.7;
}
.notas-area:focus{border-color:var(--blue);}

/* ── TOAST ── */
.toasts{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:7px;}
.toast{
  background:var(--surf);border:1px solid var(--border);border-radius:7px;
  padding:10px 14px;font-size:12px;display:flex;align-items:center;gap:8px;
  animation:toastIn .18s ease;max-width:300px;
}
@keyframes toastIn{from{transform:translateX(16px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.ok {border-left:3px solid var(--green);}
.toast.err{border-left:3px solid var(--red);}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}

@media(max-width:900px){
  .sidebar{display:none;}.main{margin-left:0;}
  .stats{grid-template-columns:repeat(2,1fr);}
  .pipe-grid{grid-template-columns:repeat(3,170px);}
  .panel{width:100%;}
}
@media(max-width:600px){
  .stats{grid-template-columns:1fr 1fr;}
  .f-row{grid-template-columns:1fr;}
  .c-date,.c-val{display:none;}
}
</style>
</head>
<body>
<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">VESTRA</div>
    <div class="logo-sub">CRM · Clientes</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section">Vistas</div>
    <button class="nav-btn active" onclick="setVista('lista')" id="nav-lista"><span class="ico">☰</span> Lista</button>
    <button class="nav-btn" onclick="setVista('pipeline')" id="nav-pipeline"><span class="ico">⬛</span> Pipeline</button>
    <div class="nav-section">Seguimiento</div>
    <button class="nav-btn" onclick="setVista('proximos')" id="nav-proximos"><span class="ico">📅</span> Próximos</button>
    <button class="nav-btn" onclick="setVista('notas')" id="nav-notas"><span class="ico">📝</span> Mis Notas</button>
  </nav>
  <div class="sidebar-foot">
    <button class="btn-new" onclick="abrirModal()">+ Nuevo Cliente</button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">Todos los clientes</div>
    <div class="topbar-right">
      <div class="search">
        <span style="color:var(--muted);font-size:12px">🔍</span>
        <input type="text" id="buscador" placeholder="Buscar…" oninput="renderLista()">
      </div>
      <button class="btn-new" style="width:auto;padding:7px 14px;font-size:12px" onclick="abrirModal()">+ Nuevo</button>
    </div>
  </div>

  <div class="content">
    <div class="stats" id="stats"></div>

    <div id="vista-lista">
      <div class="filters" id="filters"></div>
      <div class="c-list" id="c-list"></div>
    </div>

    <div id="vista-pipeline" style="display:none">
      <div class="pipe-grid" id="pipe-grid"></div>
    </div>

    <div id="vista-proximos" style="display:none">
      <div class="c-list" id="prox-list"></div>
    </div>

    <div id="vista-notas" style="display:none">
      <div class="p-ttl" style="margin-bottom:10px">MIS NOTAS GENERALES</div>
      <textarea class="notas-area" id="notas-area" placeholder="Escribe tus notas, estrategias, ideas…" oninput="saveNotas()"></textarea>
      <div style="font-size:10px;color:var(--muted);margin-top:8px">Guardado automáticamente en tu navegador</div>
    </div>
  </div>
</div>
</div>

<!-- PANEL DETALLE -->
<div class="panel-ov" id="panel-ov" onclick="closePanelOv(event)">
  <div class="panel">
    <div class="panel-hd">
      <div>
        <div class="panel-name" id="p-name"></div>
        <div class="panel-co" id="p-co"></div>
      </div>
      <button class="close-btn" onclick="closePanel()">✕</button>
    </div>
    <div class="panel-body">
      <div class="p-section">
        <div class="p-ttl">Información</div>
        <div class="info-grid">
          <div class="info-item"><label>Email</label><span id="d-email" class="dim"></span></div>
          <div class="info-item"><label>Teléfono</label><span id="d-tel" class="dim"></span></div>
          <div class="info-item"><label>Valor estimado</label><span id="d-val"></span></div>
          <div class="info-item"><label>Próximo seguimiento</label><span id="d-seg"></span></div>
          <div class="info-item" style="grid-column:1/-1"><label>Origen</label><span id="d-orig" class="dim"></span></div>
        </div>
      </div>
      <div class="p-section">
        <div class="p-ttl">Etapa del pipeline</div>
        <div class="etapa-sel" id="etapa-sel"></div>
      </div>
      <div class="p-section">
        <div class="p-ttl">Notas</div>
        <div id="d-notes" style="font-size:12px;color:var(--muted);line-height:1.6"></div>
      </div>
      <div class="p-section">
        <div class="p-ttl">Historial de interacciones</div>
        <div class="inter-list" id="inter-list"></div>
        <div class="form-inter">
          <div class="tipo-row">
            <button class="t-btn active" data-tipo="llamada" onclick="selTipo(this)">📞 Llamada</button>
            <button class="t-btn" data-tipo="email" onclick="selTipo(this)">📧 Email</button>
            <button class="t-btn" data-tipo="reunion" onclick="selTipo(this)">🤝 Reunión</button>
            <button class="t-btn" data-tipo="whatsapp" onclick="selTipo(this)">💬 WhatsApp</button>
            <button class="t-btn" data-tipo="nota" onclick="selTipo(this)">📝 Nota</button>
          </div>
          <textarea id="inter-txt" rows="2" placeholder="Describe la interacción…"></textarea>
          <div class="inter-foot">
            <button class="btn-reg" onclick="addInter()">Registrar</button>
          </div>
        </div>
      </div>
    </div>
    <div class="panel-foot">
      <button class="btn-edit" onclick="editCurrent()">Editar cliente</button>
      <button class="btn-del" onclick="delCurrent()">Eliminar</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-ov" id="modal-ov" onclick="closeModalOv(event)">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-ttl" id="modal-ttl">Nuevo cliente</div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="f-row">
        <div class="f-grp"><label>Nombre *</label><input id="f-nombre" placeholder="Juan García"></div>
        <div class="f-grp"><label>Empresa</label><input id="f-empresa" placeholder="Acme S.A."></div>
      </div>
      <div class="f-row">
        <div class="f-grp"><label>Email</label><input type="email" id="f-email" placeholder="juan@empresa.com"></div>
        <div class="f-grp"><label>Teléfono</label><input id="f-tel" placeholder="+52 55 1234 5678"></div>
      </div>
      <div class="f-row">
        <div class="f-grp">
          <label>Etapa</label>
          <select id="f-etapa">
            <option value="lead">Lead</option>
            <option value="prospecto">Prospecto</option>
            <option value="propuesta">Propuesta enviada</option>
            <option value="negociacion">Negociación</option>
            <option value="activo">Cliente activo</option>
            <option value="perdido">Cerrado / Perdido</option>
          </select>
        </div>
        <div class="f-grp"><label>Valor estimado</label><input id="f-val" placeholder="$5,000 MXN"></div>
      </div>
      <div class="f-row">
        <div class="f-grp"><label>Próximo seguimiento</label><input type="date" id="f-seg"></div>
        <div class="f-grp"><label>Origen / Fuente</label><input id="f-orig" placeholder="Referido, Instagram…"></div>
      </div>
      <div class="f-grp full"><label>Notas iniciales</label><textarea id="f-notes" placeholder="Información relevante del cliente…"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveClient()">Guardar cliente</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
const ETAPAS=[
  {id:'lead',       label:'Lead',        icon:'🔍'},
  {id:'prospecto',  label:'Prospecto',   icon:'💡'},
  {id:'propuesta',  label:'Propuesta',   icon:'📄'},
  {id:'negociacion',label:'Negociación', icon:'⚡'},
  {id:'activo',     label:'Activo',      icon:'✅'},
  {id:'perdido',    label:'Perdido',     icon:'❌'},
];
const TIPOS={
  llamada: {icon:'📞',label:'Llamada'},
  email:   {icon:'📧',label:'Email'},
  reunion: {icon:'🤝',label:'Reunión'},
  whatsapp:{icon:'💬',label:'WhatsApp'},
  nota:    {icon:'📝',label:'Nota'},
};

let clients=JSON.parse(localStorage.getItem('vestra_crm')||'[]');
let filtro='todos', vista='lista', selId=null, editId=null, tipoSel='llamada';

const save=()=>localStorage.setItem('vestra_crm',JSON.stringify(clients));
const saveNotas=()=>localStorage.setItem('vestra_notas',document.getElementById('notas-area').value);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const inits=n=>n.split(' ').slice(0,2).map(p=>p[0]||'').join('').toUpperCase()||'?';
const fmtDate=iso=>{if(!iso)return'—';const[y,m,d]=iso.split('-');return`${d}/${m}/${y}`;};
const dateClass=iso=>{
  if(!iso)return'';
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const diff=Math.round((new Date(iso+'T00:00:00')-hoy)/86400000);
  if(diff<0)return'date-overdue';if(diff===0)return'date-today';if(diff<=3)return'date-soon';return'';
};

function toast(msg,type='ok'){
  const el=document.createElement('div');el.className=`toast ${type}`;
  el.innerHTML=`<span>${type==='ok'?'✓':'!'}</span> ${msg}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

/* ── STATS ── */
function renderStats(){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const venc=clients.filter(c=>c.seg&&new Date(c.seg+'T00:00:00')<=hoy&&c.etapa!=='activo'&&c.etapa!=='perdido').length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-lbl">Total clientes</div><div class="stat-val">${clients.length}</div></div>
    <div class="stat"><div class="stat-lbl">Activos</div><div class="stat-val c-green">${clients.filter(c=>c.etapa==='activo').length}</div></div>
    <div class="stat"><div class="stat-lbl">Propuesta / Negociación</div><div class="stat-val c-blue">${clients.filter(c=>c.etapa==='propuesta'||c.etapa==='negociacion').length}</div></div>
    <div class="stat"><div class="stat-lbl">Seguimientos vencidos</div><div class="stat-val c-orange">${venc}</div></div>`;
}

/* ── FILTERS ── */
function renderFilters(){
  const btns=[{id:'todos',label:'Todos',n:clients.length}]
    .concat(ETAPAS.map(e=>({id:e.id,label:e.label,n:clients.filter(c=>c.etapa===e.id).length})));
  document.getElementById('filters').innerHTML=btns.map(b=>
    `<button class="f-btn ${filtro===b.id?'active':''}" onclick="setFiltro('${b.id}')">${b.label}<span class="f-cnt">${b.n}</span></button>`
  ).join('');
}
function setFiltro(id){filtro=id;renderFilters();renderLista();}

/* ── LIST ── */
function renderLista(){
  const q=document.getElementById('buscador').value.toLowerCase();
  let list=clients.filter(c=>{
    if(filtro!=='todos'&&c.etapa!==filtro)return false;
    if(q&&!c.nombre.toLowerCase().includes(q)&&!(c.empresa||'').toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>{
    if(!a.seg&&!b.seg)return 0;if(!a.seg)return 1;if(!b.seg)return -1;
    return a.seg.localeCompare(b.seg);
  });
  const el=document.getElementById('c-list');
  if(!list.length){el.innerHTML=`<div class="empty"><div class="empty-ico">👥</div><div class="empty-ttl">Sin clientes</div><div class="empty-sub">Agrega tu primer cliente con "+ Nuevo"</div></div>`;return;}
  el.innerHTML=list.map(c=>{
    const e=ETAPAS.find(x=>x.id===c.etapa)||ETAPAS[0];
    return`<div class="c-card" onclick="openPanel('${c.id}')">
      <div class="c-av">${inits(c.nombre)}</div>
      <div class="c-info"><div class="c-name">${c.nombre}</div><div class="c-company">${c.empresa||'Sin empresa'}</div></div>
      <div class="c-meta">
        <span class="badge b-${c.etapa}">${e.icon} ${e.label}</span>
        <div class="c-val">${c.val||'—'}</div>
        <div class="c-date ${dateClass(c.seg)}">${c.seg?fmtDate(c.seg):'—'}</div>
      </div>
    </div>`;
  }).join('');
}

/* ── PIPELINE ── */
function renderPipeline(){
  const cols={lead:'var(--orange)',prospecto:'var(--blue)',propuesta:'var(--purple)',negociacion:'var(--yellow)',activo:'var(--green)',perdido:'var(--red)'};
  document.getElementById('pipe-grid').innerHTML=ETAPAS.map(e=>{
    const cs=clients.filter(c=>c.etapa===e.id);
    const cards=cs.map(c=>`<div class="pipe-card" onclick="openPanel('${c.id}')">
      <div class="pipe-card-name">${c.nombre}</div>
      <div class="pipe-card-co">${c.empresa||'Sin empresa'}</div>
      ${c.val?`<div class="pipe-card-val">${c.val}</div>`:''}
    </div>`).join('')||`<div style="font-size:10px;color:var(--muted);text-align:center;margin-top:18px">Sin clientes</div>`;
    return`<div class="pipe-col">
      <div class="pipe-head"><span class="pipe-title" style="color:${cols[e.id]}">${e.icon} ${e.label}</span><span class="pipe-cnt">${cs.length}</span></div>
      <div class="pipe-body">${cards}</div>
    </div>`;
  }).join('');
}

/* ── PRÓXIMOS ── */
function renderProximos(){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const list=clients.filter(c=>c.seg&&c.etapa!=='perdido').sort((a,b)=>a.seg.localeCompare(b.seg)).slice(0,30);
  const el=document.getElementById('prox-list');
  if(!list.length){el.innerHTML=`<div class="empty"><div class="empty-ico">📅</div><div class="empty-ttl">Sin seguimientos agendados</div><div class="empty-sub">Asigna fechas de seguimiento a tus clientes</div></div>`;return;}
  el.innerHTML=list.map(c=>{
    const e=ETAPAS.find(x=>x.id===c.etapa)||ETAPAS[0];
    const diff=Math.round((new Date(c.seg+'T00:00:00')-hoy)/86400000);
    const dl=diff<0?`<span style="color:var(--red);font-size:10px">${Math.abs(diff)}d vencido</span>`
      :diff===0?`<span style="color:var(--orange);font-size:10px">Hoy</span>`
      :diff===1?`<span style="color:var(--yellow);font-size:10px">Mañana</span>`
      :`<span style="color:var(--muted);font-size:10px">En ${diff}d</span>`;
    return`<div class="c-card" onclick="openPanel('${c.id}')">
      <div class="c-av">${inits(c.nombre)}</div>
      <div class="c-info"><div class="c-name">${c.nombre}</div><div class="c-company">${c.empresa||'Sin empresa'}</div></div>
      <div class="c-meta"><span class="badge b-${c.etapa}">${e.icon} ${e.label}</span>${dl}<div class="c-date ${dateClass(c.seg)}">${fmtDate(c.seg)}</div></div>
    </div>`;
  }).join('');
}

/* ── VISTAS ── */
function setVista(v){
  vista=v;
  ['lista','pipeline','proximos','notas'].forEach(id=>{
    document.getElementById('vista-'+id).style.display=id===v?'':'none';
    const nb=document.getElementById('nav-'+id);if(nb)nb.classList.toggle('active',id===v);
  });
  const titulos={lista:'Todos los clientes',pipeline:'Pipeline',proximos:'Próximos seguimientos',notas:'Mis notas'};
  document.getElementById('topbar-title').textContent=titulos[v]||'';
  document.getElementById('stats').style.display=v==='notas'?'none':'';
  if(v==='lista'){renderFilters();renderLista();}
  if(v==='pipeline')renderPipeline();
  if(v==='proximos')renderProximos();
  if(v==='notas')document.getElementById('notas-area').value=localStorage.getItem('vestra_notas')||'';
}

/* ── PANEL ── */
function openPanel(id){
  selId=id;const c=clients.find(x=>x.id===id);if(!c)return;
  document.getElementById('p-name').textContent=c.nombre;
  document.getElementById('p-co').textContent=c.empresa||'Sin empresa';
  document.getElementById('d-email').textContent=c.email||'—';
  document.getElementById('d-tel').textContent=c.tel||'—';
  document.getElementById('d-val').textContent=c.val||'—';
  document.getElementById('d-orig').textContent=c.orig||'—';
  document.getElementById('d-notes').textContent=c.notes||'Sin notas';
  const ds=document.getElementById('d-seg');
  ds.textContent=c.seg?fmtDate(c.seg):'—';ds.className=dateClass(c.seg);
  document.getElementById('etapa-sel').innerHTML=ETAPAS.map(e=>
    `<button class="e-opt ${c.etapa===e.id?'s-'+e.id:''}" onclick="setEtapa('${e.id}')">${e.icon} ${e.label}</button>`
  ).join('');
  renderInter(c);
  tipoSel='llamada';
  document.querySelectorAll('.t-btn').forEach(b=>b.classList.toggle('active',b.dataset.tipo==='llamada'));
  document.getElementById('inter-txt').value='';
  document.getElementById('panel-ov').classList.add('open');
}
function closePanelOv(e){if(e.target===document.getElementById('panel-ov'))closePanel();}
function closePanel(){document.getElementById('panel-ov').classList.remove('open');selId=null;renderAll();}

function renderInter(c){
  const list=(c.inters||[]).slice().reverse();
  const el=document.getElementById('inter-list');
  if(!list.length){el.innerHTML=`<div style="font-size:11px;color:var(--muted)">Aún no hay interacciones registradas</div>`;return;}
  el.innerHTML=list.map(i=>{
    const t=TIPOS[i.tipo]||{icon:'📝',label:i.tipo};
    return`<div class="inter-item">
      <div class="inter-ico">${t.icon}</div>
      <div class="inter-body">
        <div class="inter-hd"><span class="inter-tipo">${t.label}</span><span class="inter-fecha">${i.fecha}</span></div>
        <div class="inter-txt">${i.texto}</div>
      </div>
    </div>`;
  }).join('');
}

function selTipo(btn){
  tipoSel=btn.dataset.tipo;
  document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function addInter(){
  const texto=document.getElementById('inter-txt').value.trim();
  if(!texto){toast('Escribe una descripción','err');return;}
  const c=clients.find(x=>x.id===selId);if(!c)return;
  if(!c.inters)c.inters=[];
  const ahora=new Date();
  const fecha=`${ahora.getDate().toString().padStart(2,'0')}/${(ahora.getMonth()+1).toString().padStart(2,'0')}/${ahora.getFullYear()} ${ahora.getHours().toString().padStart(2,'0')}:${ahora.getMinutes().toString().padStart(2,'0')}`;
  c.inters.push({tipo:tipoSel,texto,fecha});
  save();document.getElementById('inter-txt').value='';renderInter(c);toast('Interacción registrada');
}

function setEtapa(etapa){
  const c=clients.find(x=>x.id===selId);if(!c)return;
  c.etapa=etapa;save();
  document.getElementById('etapa-sel').innerHTML=ETAPAS.map(e=>
    `<button class="e-opt ${etapa===e.id?'s-'+e.id:''}" onclick="setEtapa('${e.id}')">${e.icon} ${e.label}</button>`
  ).join('');
  toast('Etapa actualizada');renderStats();renderFilters();
}

function editCurrent(){const id=selId;closePanel();if(id)openModal(id);}
function delCurrent(){
  if(!confirm('¿Eliminar este cliente?'))return;
  clients=clients.filter(x=>x.id!==selId);save();closePanel();toast('Cliente eliminado');
}

/* ── MODAL ── */
function openModal(id=null){
  editId=id;
  document.getElementById('modal-ttl').textContent=id?'Editar cliente':'Nuevo cliente';
  const fields=['nombre','empresa','email','tel','etapa','val','seg','orig','notes'];
  if(id){
    const c=clients.find(x=>x.id===id);
    if(c)fields.forEach(k=>{const el=document.getElementById('f-'+k);if(el)el.value=c[k]||'';});
  }else{
    fields.forEach(k=>{const el=document.getElementById('f-'+k);if(el)el.value=k==='etapa'?'lead':'';});
  }
  document.getElementById('modal-ov').classList.add('open');
}
function closeModal(){document.getElementById('modal-ov').classList.remove('open');editId=null;}
function closeModalOv(e){if(e.target===document.getElementById('modal-ov'))closeModal();}

function saveClient(){
  const nombre=document.getElementById('f-nombre').value.trim();
  if(!nombre){toast('El nombre es obligatorio','err');return;}
  const data={
    nombre,empresa:document.getElementById('f-empresa').value.trim(),
    email:document.getElementById('f-email').value.trim(),tel:document.getElementById('f-tel').value.trim(),
    etapa:document.getElementById('f-etapa').value,val:document.getElementById('f-val').value.trim(),
    seg:document.getElementById('f-seg').value,orig:document.getElementById('f-orig').value.trim(),
    notes:document.getElementById('f-notes').value.trim(),
  };
  if(editId){
    const idx=clients.findIndex(x=>x.id===editId);
    if(idx!==-1){clients[idx]={...clients[idx],...data};toast('Cliente actualizado');}
  }else{
    clients.push({id:uid(),...data,inters:[]});toast('Cliente agregado');
  }
  save();closeModal();renderAll();
}

function renderAll(){
  renderStats();
  if(vista==='lista'){renderFilters();renderLista();}
  if(vista==='pipeline')renderPipeline();
  if(vista==='proximos')renderProximos();
}

/* ── DATOS EJEMPLO ── */
function seedData(){
  if(clients.length>0)return;
  const hoy=new Date();
  const d=n=>{const f=new Date(hoy);f.setDate(f.getDate()+n);return f.toISOString().split('T')[0];};

    {id:uid(),nombre:'Carlos Ruiz',empresa:'Digital Norte',email:'carlos@digitalnorte.mx',tel:'+52 81 1234 5678',etapa:'negociacion',val:'$35,000 MXN',seg:d(0),orig:'Instagram',notes:'Quiere descuento del 10%. Aprobado hasta 8%.',inters:[{tipo:'reunion',texto:'Reunión Zoom 45 min. Piden ajuste de precio.',fecha:'07/05/2026 11:00'}]},
    {id:uid(),nombre:'Ana Flores',empresa:'Boutique Sofía',email:'ana@boutique.com',tel:'+52 33 5555 4444',etapa:'activo',val:'$8,500 MXN',seg:d(14),orig:'Referido',notes:'Cliente satisfecha. Paga puntual.',inters:[{tipo:'llamada',texto:'Seguimiento mensual. Todo bien.',fecha:'01/05/2026 09:00'}]},
    {id:uid(),nombre:'Roberto Salas',empresa:'InverSal',email:'r.salas@inversal.com',tel:'',etapa:'lead',val:'$50,000 MXN',seg:d(3),orig:'LinkedIn',notes:'Contacto frío. Necesita más información del servicio.',inters:[]},
    {id:uid(),nombre:'Laura Méndez',empresa:'',email:'lmendez@gmail.com',tel:'+52 55 7777 8888',etapa:'perdido',val:'$12,000 MXN',seg:'',orig:'Facebook Ads',notes:'Eligió a la competencia por precio.',inters:[{tipo:'nota',texto:'Cerrado. No se logró negociar precio.',fecha:'03/05/2026 16:00'}]},

seedData();
renderAll();

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePanel();closeModal();}
});
</script>
</body>
